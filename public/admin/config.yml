# Two ways in:
#  * remotely — «Sign In with GitHub Using Token» on the login screen: paste a
#    fine-grained personal access token (this repository only, Contents: Read
#    and write). The browser then talks to the GitHub API directly — commits,
#    GPG-signed by Sveltia, land on master and deploy through the usual Actions
#    pipeline. No OAuth app, no proxy, nothing extra to host.
#  * on the workstation — «Work with Local Repository»: edits the working copy
#    directly, commits and pushes stay a manual git step.
backend:
  name: github
  repo: stanleymarch/staniverse
  branch: master
media_folder: public/media/admin-uploads
public_folder: /media/admin-uploads
omit_empty_optional_fields: true

