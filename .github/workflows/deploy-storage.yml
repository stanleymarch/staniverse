name: Deploy to Yandex Object Storage

# Production deploy: build the static site and sync it into the bucket that
# serves staniverse.xyz. Full playbook (bucket setup, TLS, secrets):
# docs/deploy/yandex-object-storage.md

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-storage
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      AWS_EC2_METADATA_DISABLED: "true"
      ENDPOINT: ${{ vars.YC_ENDPOINT }}
      BUCKET: ${{ vars.YC_BUCKET }}
      CDN_RESOURCE_ID: ${{ vars.YC_CDN_RESOURCE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        env:
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}
          YANDEX_WEBMASTER_VERIFICATION: ${{ vars.YANDEX_WEBMASTER_VERIFICATION }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test "$AWS_ACCESS_KEY_ID" != "REPLACE_WITH_YANDEX_ACCESS_KEY_ID"
          test "$AWS_SECRET_ACCESS_KEY" != "REPLACE_WITH_YANDEX_SECRET_ACCESS_KEY"
          test -n "$ENDPOINT"
          test -n "$BUCKET"
          [[ "$PUBLIC_YANDEX_METRIKA_ID" =~ ^[0-9]+$ ]]
          test -n "$YANDEX_WEBMASTER_VERIFICATION"

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Production identity: absolute URLs in canonical/OG/JSON-LD/sitemap
          # must point at the real domain, never at a preview host.
          SITE_URL: https://staniverse.xyz
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}
          YANDEX_WEBMASTER_VERIFICATION: ${{ vars.YANDEX_WEBMASTER_VERIFICATION }}
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html && test -f dist/404.html

      # A fresh Astro build gives every file a new mtime, so a plain `s3 sync`
      # re-PUTs nearly the whole 2000-page site. The manifest compares content
      # hashes instead: docs-only pushes cost zero PUTs, and a new post uploads
      # only pages and indexes whose bytes really changed.
      - name: Fetch previous deployment manifest
        id: previous
        run: |
          mkdir -p tmp
          if aws s3 cp "s3://$BUCKET/.deploy-manifest.json" tmp/storage-manifest.prev.json \
            --endpoint-url "$ENDPOINT" --no-progress --only-show-errors; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # One-time migration: discover matching remote objects by ETag/size so
      # introducing the manifest does not itself cause another full-site PUT.
      - name: Inventory existing objects for manifest bootstrap
        if: steps.previous.outputs.found == 'false'
        run: |
          aws --endpoint-url "$ENDPOINT" s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --output json > tmp/storage-remote-inventory.json

      - name: Plan content-hash delta
        id: plan
        env:
          DEPLOY_ROOT: dist
          DEPLOY_PREVIOUS_MANIFEST: tmp/storage-manifest.prev.json
          DEPLOY_REMOTE_INVENTORY: tmp/storage-remote-inventory.json
          DEPLOY_OUTPUT: tmp/storage-deploy
        run: node scripts/plan-storage-deploy.mjs

      - name: Upload changed HTML (no-cache)
        if: steps.plan.outputs.html != '0'
        run: |
          aws s3 cp tmp/storage-deploy/upload/html/ "s3://$BUCKET/" --recursive \
            --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=0, must-revalidate" \
            --no-progress --only-show-errors

      - name: Upload changed hashed assets (immutable)
        if: steps.plan.outputs.immutable != '0'
        run: |
          aws s3 cp tmp/storage-deploy/upload/immutable/ "s3://$BUCKET/" --recursive \
            --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress --only-show-errors

      - name: Upload changed media (long cache)
        if: steps.plan.outputs.media != '0'
        run: |
          aws s3 cp tmp/storage-deploy/upload/media/ "s3://$BUCKET/" --recursive \
            --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=2592000, must-revalidate" \
            --no-progress --only-show-errors

      - name: Upload changed static assets (short cache)
        if: steps.plan.outputs.other != '0'
        run: |
          aws s3 cp tmp/storage-deploy/upload/other/ "s3://$BUCKET/" --recursive \
            --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=86400, must-revalidate" \
            --no-progress --only-show-errors

      - name: Delete stale owned objects
        if: steps.plan.outputs.deleted != '0'
        run: |
          for payload in tmp/storage-deploy/delete/*.json; do
            aws --endpoint-url "$ENDPOINT" s3api delete-objects \
              --bucket "$BUCKET" \
              --delete "file://$payload"
          done

      # Commit last: the manifest always describes a fully applied deployment.
      - name: Publish deployment manifest
        if: steps.plan.outputs.manifest_changed == 'true'
        run: |
          aws s3 cp tmp/storage-deploy/manifest.json "s3://$BUCKET/.deploy-manifest.json" \
            --endpoint-url "$ENDPOINT" \
            --cache-control "no-cache" \
            --content-type "application/json" \
            --no-progress --only-show-errors

      # Purge only when a CDN exists and object bytes actually changed.
      - name: Purge CDN cache
        if: env.CDN_RESOURCE_ID != '' && (steps.plan.outputs.changed != '0' || steps.plan.outputs.deleted != '0')
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        run: |
          echo "$YC_SA_KEY" > sa-key.json
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          yc config profile create ci --service-account-key sa-key.json || true
          yc config set folder-id "$YC_FOLDER_ID"
          yc cdn cache purge --resource-id "$CDN_RESOURCE_ID" --path "/*"
          rm -f sa-key.json
