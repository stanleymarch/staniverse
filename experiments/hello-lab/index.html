<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Hello, Lab · Staniverse</title>
  <style>
    /* Deliberately self-contained: an experiment owns its whole stack and must
       never reach into the main site's styles or fonts. */
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06080f; color: #eef3ff; font: 400 clamp(1rem, 2.4vw, 1.2rem)/1.6 system-ui, sans-serif; }
    main { max-width: 34rem; padding: 2rem; text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 3rem; height: 3rem; margin-bottom: 1.2rem; border: 1px solid #7fd4f0; border-radius: 999px; color: #7fd4f0; font-weight: 700; }
    h1 { margin: 0 0 .6rem; font-size: 1.6rem; letter-spacing: -.02em; }
    p { margin: 0 0 1.4rem; color: #93a5c0; }
    a { color: #7fd4f0; }
    footer { margin-top: 2rem; font-size: .85rem; color: #93a5c0; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">s</span>
    <h1>Привет, это Лаборатория</h1>
    <p>Эта страница — проверка конвейера: правка в <code>experiments/hello-lab/</code>, git push — и сборка сама уезжает в бакет по адресу <code>/lab/hello-lab/</code>.</p>
    <p id="ping">Конвейер говорит: …</p>
    <footer><a href="/lab/">← Все эксперименты</a> · <a href="/">staniverse.xyz</a></footer>
  </main>
  <script>
    document.getElementById("ping").textContent = `Конвейер говорит: живой скрипт отработал в ${new Date().toLocaleTimeString("ru-RU")}.`;
  </script>
</body>
</html>
